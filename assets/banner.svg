<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bgrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4de2ff" />
      <stop offset="100%" stop-color="#6a5cff" />
    </linearGradient>
    <radialGradient id="amb" cx="20%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#4de2ff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1200" height="400" fill="#030712"/>
  <rect width="1200" height="400" fill="url(#amb)"/>
  
  <!-- Circuit Grid Background -->
  <g stroke="#4de2ff" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>

  <!-- Large Faded Icon Graphic on the Right -->
  <g transform="translate(800, 80) scale(4.5)" fill="none" stroke="#4de2ff" stroke-opacity="0.12" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16 36 a16 16 0 0 1 32 0" />
    <path d="M16 36 a16 16 0 0 0 32 0" />
    <circle cx="16" cy="36" r="5" fill="#4de2ff" fill-opacity="0.2"/>
    <circle cx="48" cy="36" r="5" fill="#6a5cff" fill-opacity="0.2"/>
  </g>

  <!-- Icon Box -->
  <g transform="translate(100, 120)">
    <rect width="160" height="160" rx="36" fill="#060d1a" stroke="#4de2ff" stroke-width="2" stroke-opacity="0.4"/>
    <g transform="translate(32, 32) scale(1.5)" fill="none" stroke-width="2.5">
      <path d="M16 36 a16 16 0 0 1 32 0" stroke="#4de2ff"/>
      <path d="M16 36 a16 16 0 0 0 32 0" stroke="#6a5cff"/>
      <circle cx="16" cy="36" r="5" fill="#4de2ff"/>
      <circle cx="48" cy="36" r="5" fill="#6a5cff"/>
    </g>
  </g>

  <!-- Title & Subtitle Typography -->
  <text x="300" y="195" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="56" font-weight="700" fill="#f8fafc" letter-spacing="-1">QEL</text>
  <text x="300" y="245" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="600" fill="#4de2ff" letter-spacing="3.5">KELLER SYSTEMS</text>

  <!-- Outer Frame -->
  <rect x="1" y="1" width="1198" height="398" rx="0" fill="none" stroke="#4de2ff" stroke-width="1" stroke-opacity="0.2"/>
</svg>
